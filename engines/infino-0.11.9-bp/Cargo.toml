[package]
name = "infino-bench"
version = "0.1.0"
edition = "2024"

[lib]
name = "infino_bench"
path = "src/lib.rs"

[[bin]]
name = "build_index"
path = "src/bin/build_index.rs"

[[bin]]
name = "do_query"
path = "src/bin/do_query.rs"

[dependencies]
# The published infino crate, pinned to the exact 0.11.9 release so a run is
# fully reproducible (the engine is named for this version). This engine
# benchmarks the supertable query path (manifest + per-segment fan-out) — the
# production surface — built as a SINGLE segment so it is a like-for-like
# comparison with the force-merged single-segment indexes tantivy and lucene
# build. Compaction reorders documents by recursive graph bisection, so this
# is the `-bp` column (see details.json), the counterpart to lucene-*-bp.
infino = { version = "=0.11.9", features = ["test-helpers"] }
arrow-array = "58"
arrow-schema = "58"
rayon = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
opt-level = 3
overflow-checks = false
codegen-units = 1
